name: ci

on: [pull_request, push]

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      # better-auth requires a secret in production mode (e2e runs next start);
      # this is a CI-only dev value, not a real credential
      BETTER_AUTH_SECRET: ci-only-dev-secret-not-a-real-credential
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - run: pnpm build
